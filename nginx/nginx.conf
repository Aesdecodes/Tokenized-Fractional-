events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # JSON log format for log aggregation (ELK / Filebeat)
    log_format json escape=json '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"remote_user":"$remote_user",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"server_protocol":"$server_protocol",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_forwarded_for":"$http_x_forwarded_for",'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_response_time":"$upstream_response_time",'
        '"log_format":"json"'
    '}';

    access_log /var/log/nginx/access.log json;
    error_log /var/log/nginx/error.log;

    # Rate limiting zone for API requests: 10 requests per second per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_status 429;
    # DDoS protection: max 50 simultaneous connections per IP
    limit_conn_zone $binary_remote_addr zone=addr_limit:10m;

    # ── Global security headers ───────────────────────────────────────────────
    server_tokens off;
    add_header X-Frame-Options          "SAMEORIGIN"     always;
    add_header X-XSS-Protection         "1; mode=block"  always;
    add_header X-Content-Type-Options   "nosniff"        always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

    # ── HTTP server (redirects to HTTPS in production) ────────────────────────
    server {
        listen 80;
        server_name _;

        # ACME challenge pass-through for Let's Encrypt / certbot renewals
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ─────────────────────────────────────────────────────────────────────────
    # HTTPS server (port 443) — TLS termination
    # ─────────────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2  on;
        server_name localhost;

        # ── Certificate paths ─────────────────────────────────────────────────
        # Replace with real certificate paths in production.
        # For local dev, generate with:  bash scripts/generate-certs.sh
        ssl_certificate     /etc/ssl/rwa/nginx.crt;
        ssl_certificate_key /etc/ssl/rwa/nginx.key;

        # ── HTTP Strict Transport Security (HSTS) ─────────────────────────────
        # Tells browsers to always use HTTPS for this host.
        # Start with a short max-age in staging; increase to 31536000 (1 year)
        # once confident, then consider adding to HSTS preload lists.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        # DDoS protection
        limit_conn addr_limit 50;

        # ── Basic WAF rules ───────────────────────────────────────────────────
        if ($http_user_agent ~* (sqlmap|nikto|nmap|masscan|zmap)) {
            return 403;
        }
        if ($query_string ~* "union.*select.*\(") {
            return 403;
        }
        if ($query_string ~* "concat.*\(") {
            return 403;
        }

        # If a real domain is configured, redirect HTTP → HTTPS
        if ($host != "localhost") {
            return 301 https://$host$request_uri;
        }

        # Proxy /api requests to the Express backend
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass         http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        'upgrade';
            proxy_set_header   Host              $host;
            proxy_cache_bypass $http_upgrade;

            # Forward client IP for accurate rate limiting and audit logs
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── /* → Vite / React frontend ─────────────────────────────────────────
        location / {
            proxy_pass         http://127.0.0.1:5173;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        'upgrade';
            proxy_set_header   Host              $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }

    # ── HTTPS server (enabled when SSL certificate is installed) ────────────────
    # Uncomment and configure the ssl_* paths after running scripts/setup-ssl.sh.
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #
    #     ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    #     ssl_trusted_certificate /etc/letsencrypt/live/your-domain.com/chain.pem;
    #
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    #     ssl_prefer_server_ciphers off;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 1d;
    #     ssl_session_tickets off;
    #
    #     ssl_stapling on;
    #     ssl_stapling_verify on;
    #     resolver 1.1.1.1 8.8.8.8 valid=300s;
    #     resolver_timeout 5s;
    #
    #     add_header Strict-Transport-Security "max-age=63072000" always;
    #
    #     location /api/ {
    #         limit_req zone=api_limit burst=20 nodelay;
    #         proxy_pass http://127.0.0.1:3001;
    #         proxy_http_version 1.1;
    #         proxy_set_header Upgrade $http_upgrade;
    #         proxy_set_header Connection 'upgrade';
    #         proxy_set_header Host $host;
    #         proxy_cache_bypass $http_upgrade;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #     }
    #
    #     location / {
    #         proxy_pass http://127.0.0.1:5173;
    #         proxy_http_version 1.1;
    #         proxy_set_header Upgrade $http_upgrade;
